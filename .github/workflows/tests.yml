name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch (small and fast for CI)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the rest
        run: pip install pandas numpy pyarrow scikit-learn matplotlib joblib transformers pytest
      - name: Run unit tests
        run: pytest -v
